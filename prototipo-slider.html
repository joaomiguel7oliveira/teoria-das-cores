<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Cor oposta com slider</title>
<style>
  :root { --ink: #16181d; --muted: #7a7a72; --line: #dcd8cf; --ok: #2d6a4f; --bad: #b4452f; --bg: #f3f1ec; --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; --cor: #fb9902;
    /* o mesmo degradê no círculo e no slider: as 12 cores principais, misturadas entre si */
    --stops: #fe2712, #fc600a, #fb9902, #fccc1a, #fefe33, #b2d732, #66b032, #347c98, #0247fe, #4424d6, #8601af, #c21460, #fe2712; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { height: 100dvh; background: var(--bg); color: var(--ink); font-family: var(--sans); display: flex; flex-direction: column; align-items: center; padding: clamp(10px, 2.4vh, 22px) 16px; }
  .coluna { width: 100%; max-width: 940px; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .topo { display: flex; justify-content: space-between; font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
  .amostra { display: inline-block; width: clamp(34px, 7vh, 54px); height: clamp(34px, 7vh, 54px); border-radius: 50%; margin-left: 16px; vertical-align: middle; background: var(--ref, #0247fe); box-shadow: 0 0 0 3px #fff, 0 0 0 4.5px var(--ink); }
  .pergunta { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; row-gap: 8px; text-align: center; font-size: clamp(1.6rem, 6vh, 2.8rem); font-weight: 700; letter-spacing: -.035em; line-height: 1.05; margin: clamp(6px, 2vh, 18px) 0 clamp(8px, 2vh, 16px); }
  .palco { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) clamp(280px, 34vw, 360px); gap: 28px; align-items: center; }
  .imagem { height: 100%; min-height: 0; display: flex; justify-content: center; }
  .imagem canvas { max-width: 100%; max-height: 100%; height: 100%; width: auto; object-fit: contain; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
  .lateral { text-align: center; }
  .rotulo { margin: 12px 0 0; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; line-height: 1.6; }

  /* círculo: degradê contínuo, com linhas de divisão a cada 15° */
  .roda-caixa { position: relative; width: min(100%, 40vh); aspect-ratio: 1; margin: 0 auto; }
  .roda { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, var(--stops));
    -webkit-mask: radial-gradient(circle, transparent 50%, #000 50.4%); mask: radial-gradient(circle, transparent 50%, #000 50.4%); }
  .roda-caixa svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* slider livre, sem encaixe: trilho em linha preta (as cores ficam só no círculo) e botão colorido com a cor atual */
  .trilho { position: relative; height: 30px; width: 100%; margin: clamp(14px, 3vh, 26px) 0 62px; }
  .barra { position: absolute; left: 15px; right: 15px; top: 14px; height: 2px; border-radius: 99px; background: var(--ink); }
  input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; outline: none; position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 30px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: var(--cor); border: 4px solid #fff; box-shadow: 0 0 0 1.5px var(--ink), 0 3px 10px rgba(0,0,0,.25); cursor: grab; }
  input[type=range]::-moz-range-track { background: transparent; height: 30px; }
  input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--cor); border: 4px solid #fff; box-shadow: 0 0 0 1.5px var(--ink); cursor: grab; }
  .alvo { position: absolute; top: -4px; width: 0; pointer-events: none; display: none; }
  .alvo.on { display: block; }
  .alvo::before { content: ""; position: absolute; left: -2px; top: 0; width: 4px; height: 46px; background: var(--ink); border-radius: 2px; }
  .alvo span { position: absolute; left: 50%; top: 50px; transform: translateX(-50%); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; white-space: nowrap; }

  .acoes { display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 92px; margin-top: 14px; }
  .retorno { font-size: .92rem; text-align: center; min-height: 2.6em; max-width: 560px; }
  .retorno.ok { color: var(--ok); } .retorno.perto { color: #8a6a1f; } .retorno.erro { color: var(--bad); }
  .btn { width: 250px; background: var(--ink); color: #fff; border: 0; border-radius: 4px; padding: 12px 24px; font: 700 .72rem var(--sans); letter-spacing: .18em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .btn.sec { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  @media (max-width: 760px) { .palco { grid-template-columns: 1fr; gap: 8px; } .roda-caixa { width: min(100%, 18vh); } .trilho { margin-bottom: 52px; } }
</style>
</head>
<body>
<div class="coluna">
  <div class="topo"><span>Protótipo · cor oposta com slider</span><span id="nota"></span></div>
  <div class="pergunta">Qual é a cor oposta a esta?<span class="amostra" id="amostra" aria-label="Cor de referência"></span></div>
  <div class="palco">
    <div class="imagem"><canvas id="tela" aria-label="Imagem com áreas amarelas que mudam de cor"></canvas></div>
    <div class="lateral">
      <div class="roda-caixa">
        <div class="roda"></div>
        <svg viewBox="0 0 200 200" id="roda" role="img" aria-label="Círculo cromático"></svg>
      </div>
      <div class="trilho">
        <div class="barra"></div>
        <input type="range" id="slider" min="0" max="360" step="1" value="0" aria-label="Cor das áreas amarelas">
        <div class="alvo" id="alvo"><span>cor oposta</span></div>
      </div>
      <p class="rotulo">Círculo cromático<br>só para consulta</p>
    </div>
  </div>
  <div class="acoes">
    <div class="retorno" id="retorno">Arraste o slider e veja as áreas amarelas mudarem de cor.</div>
    <button class="btn" id="confirmar">Confirmar</button>
  </div>
</div>

<script>
// ---------- O círculo cromático é a única régua: a posição do slider é o ângulo no círculo (0° a 360°) ----------
const RODA = [
  { nome: "vermelho", hex: "#fe2712" }, { nome: "vermelho-alaranjado", hex: "#fc600a" }, { nome: "laranja", hex: "#fb9902" },
  { nome: "amarelo-alaranjado", hex: "#fccc1a" }, { nome: "amarelo", hex: "#fefe33" }, { nome: "amarelo-esverdeado", hex: "#b2d732" },
  { nome: "verde", hex: "#66b032" }, { nome: "azul-esverdeado", hex: "#347c98" }, { nome: "azul", hex: "#0247fe" },
  { nome: "azul-violeta", hex: "#4424d6" }, { nome: "violeta", hex: "#8601af" }, { nome: "vermelho-violeta", hex: "#c21460" },
];
const FOTO = "imagens-todas/358d8be1362c3873809654510bb1ff31.jpg";
const REF = 8;                                   // cor de referência da pergunta: "azul" (posição 8 das 12)
const ANG_REF = REF * 30;                        // ângulo do azul no círculo
const ANG_OPOSTA = (ANG_REF + 180) % 360;        // a oposta fica do outro lado do círculo
const ZERO_EM = 90;                              // a nota chega a 0 quando o erro é de 90° ou mais; quanto menor o erro, mais perto de 100
const NOTA_ACERTO = 80, NOTA_PERTO = 50;         // só definem a mensagem; a nota em si é contínua
const MATIZ_AZUL_NA_FOTO = 214, MATIZ_AMARELO_NA_FOTO = 45;   // só para localizar as áreas na foto

const tela = document.getElementById("tela");
const ctx = tela.getContext("2d", { willReadFrequently: true });
const slider = document.getElementById("slider");
const retorno = document.getElementById("retorno");
const botao = document.getElementById("confirmar");
const alvoEl = document.getElementById("alvo");
let base, saida, idx, H, S, L, W, centroAm, confirmada = false;

// ---------- cor ----------
function rgbParaHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, l = (max + min) / 2;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(h * 60 + 360) % 360, s, l];
}
function hslParaRgb(h, s, l) {
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = l - c / 2;
  const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x];
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
const distAng = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const paraRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const hueDoHex = (hex) => rgbParaHsl(...paraRgb(hex))[0];
RODA.forEach((c) => { c.h = hueDoHex(c.hex); });
const mediaCircular = (a) => (Math.atan2(a.y / a.w, a.x / a.w) * 180 / Math.PI + 360) % 360;

// cor do círculo em qualquer ângulo: mistura as duas cores principais vizinhas (igual ao degradê desenhado)
function corNoAngulo(ang) {
  const pos = (((ang % 360) + 360) % 360) / 30, a = Math.floor(pos) % 12, t = pos - Math.floor(pos);
  const A = paraRgb(RODA[a].hex), B = paraRgb(RODA[(a + 1) % 12].hex);
  const hex = "#" + A.map((v, k) => Math.round(v + (B[k] - v) * t).toString(16).padStart(2, "0")).join("");
  return { hex, h: hueDoHex(hex) };
}

// ---------- círculo: linhas de divisão e o marcador da cor atual (nada além disso) ----------
function construirRoda() {
  const linhas = Array.from({ length: 24 }, (_, i) => {
    const a = i * 15 * Math.PI / 180, x1 = 100 + 50 * Math.sin(a), y1 = 100 - 50 * Math.cos(a), x2 = 100 + 100 * Math.sin(a), y2 = 100 - 100 * Math.cos(a);
    return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="#f3f1ec" stroke-width="1.4"/>`;
  }).join("");
  document.getElementById("roda").innerHTML = linhas +
    `<g id="atual"><circle r="11" fill="none" stroke="#fff" stroke-width="3"/><circle r="13.5" fill="none" stroke="#16181d" stroke-width="1.5"/></g>`;
}
function marcarAtual(ang) {
  const a = ang * Math.PI / 180, x = 100 + 75 * Math.sin(a), y = 100 - 75 * Math.cos(a);
  document.getElementById("atual").setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
}

// ---------- prepara a foto: o azul vira exatamente o azul do círculo; o amarelo vira a máscara que o slider recolore ----------
function preparar(img) {
  const k = Math.min(1, 800 / img.naturalHeight);
  tela.width = Math.round(img.naturalWidth * k); tela.height = Math.round(img.naturalHeight * k);
  ctx.drawImage(img, 0, 0, tela.width, tela.height);
  base = ctx.getImageData(0, 0, tela.width, tela.height);
  const d = base.data, rad = Math.PI / 180;

  // 1) azul da foto -> azul do círculo (a referência obedece o círculo, com a textura preservada)
  const azul = { x: 0, y: 0, w: 0 }, px = [];
  for (let p = 0; p < d.length; p += 4) {
    const [h, s, l] = rgbParaHsl(d[p], d[p + 1], d[p + 2]);
    const dh = distAng(h, MATIZ_AZUL_NA_FOTO);
    const w = (dh <= 30 ? 1 : dh >= 55 ? 0 : (55 - dh) / 25) * Math.min(1, Math.max(0, (s - 0.25) / 0.2));
    if (w > 0.02) { px.push([p, h, s, l, w]); if (w > 0.5) { azul.x += Math.cos(h * rad) * w; azul.y += Math.sin(h * rad) * w; azul.w += w; } }
  }
  const desloca = RODA[REF].h - mediaCircular(azul);
  for (const [p, h, s, l, w] of px) {
    const [r, g, b] = hslParaRgb(h + desloca, s, l);
    d[p] += (r - d[p]) * w; d[p + 1] += (g - d[p + 1]) * w; d[p + 2] += (b - d[p + 2]) * w;
  }

  // 2) áreas amarelas: máscara suave que o slider recolore
  saida = ctx.createImageData(tela.width, tela.height);
  saida.data.set(d);
  const lista = [], hs = [], ss = [], ls = [], ws = [], am = { x: 0, y: 0, w: 0 };
  for (let p = 0; p < d.length; p += 4) {
    const [h, s, l] = rgbParaHsl(d[p], d[p + 1], d[p + 2]);
    const dh = distAng(h, MATIZ_AMARELO_NA_FOTO);
    const w = (dh <= 20 ? 1 : dh >= 38 ? 0 : (38 - dh) / 18) * Math.min(1, Math.max(0, (s - 0.35) / 0.2));
    if (w > 0.02) { lista.push(p); hs.push(h); ss.push(s); ls.push(l); ws.push(w); if (w > 0.5) { am.x += Math.cos(h * rad) * w; am.y += Math.sin(h * rad) * w; am.w += w; } }
  }
  idx = Uint32Array.from(lista); H = Float32Array.from(hs); S = Float32Array.from(ss); L = Float32Array.from(ls); W = Float32Array.from(ws);
  centroAm = mediaCircular(am);
  slider.value = inicioAleatorio();
  aplicar(+slider.value);
}
// começa a pelo menos 90° da resposta, para o aluno precisar arrastar
function inicioAleatorio() { return Math.round((ANG_OPOSTA + 90 + Math.random() * 180) % 360); }

// ---------- recolore as áreas amarelas com a cor do ângulo escolhido (livre, sem encaixe) ----------
function aplicar(ang) {
  const cor = corNoAngulo(ang), desloca = cor.h - centroAm, o = base.data, d = saida.data;
  for (let i = 0; i < idx.length; i++) {
    const p = idx[i], w = W[i];
    const [r, g, b] = hslParaRgb(H[i] + desloca, S[i], L[i]);
    d[p] = o[p] + (r - o[p]) * w; d[p + 1] = o[p + 1] + (g - o[p + 1]) * w; d[p + 2] = o[p + 2] + (b - o[p + 2]) * w;
  }
  ctx.putImageData(saida, 0, 0);
  document.documentElement.style.setProperty("--cor", cor.hex);
  marcarAtual(ang);
}

// ---------- confirmação: vale a proximidade do ângulo oposto ----------
function confirmar() {
  confirmada = true;
  const dist = distAng(+slider.value, ANG_OPOSTA);
  const nota = Math.max(0, Math.round(100 * (1 - dist / ZERO_EM)));   // 0° = 100, cai de forma contínua até 0
  const cls = nota >= NOTA_ACERTO ? "ok" : nota >= NOTA_PERTO ? "perto" : "erro";
  retorno.className = "retorno " + cls;
  const msg = cls === "ok" ? "Acertou! Essas duas cores ficam em lados opostos do círculo."
    : cls === "perto" ? "Quase! Você chegou perto. A cor oposta fica bem na frente, do outro lado do círculo."
    : "Ainda não. A cor oposta fica do outro lado do círculo; veja a marca no slider.";
  retorno.textContent = `${msg} Diferença: ${Math.round(dist)}°.`;
  document.getElementById("nota").textContent = nota + " / 100";
  alvoEl.style.left = `calc(15px + (100% - 30px) * ${ANG_OPOSTA / 360})`; alvoEl.classList.add("on");
  botao.textContent = "Tentar de novo"; botao.classList.add("sec");
}
function reiniciar() {
  confirmada = false;
  slider.value = inicioAleatorio(); aplicar(+slider.value);
  alvoEl.classList.remove("on");
  document.getElementById("nota").textContent = "";
  retorno.className = "retorno"; retorno.textContent = "Arraste o slider e veja as áreas amarelas mudarem de cor.";
  botao.textContent = "Confirmar"; botao.classList.remove("sec");
}

slider.addEventListener("input", () => aplicar(+slider.value));
botao.addEventListener("click", () => (confirmada ? reiniciar() : confirmar()));

document.documentElement.style.setProperty("--ref", RODA[REF].hex);
construirRoda();
const img = new Image();
img.onload = () => preparar(img);
img.src = FOTO;
</script>
</body>
</html>
